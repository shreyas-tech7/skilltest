name: Record LLM selector

# Runs only by hand. Needs a free-tier GROQ_API_KEY secret. Sends only the synthetic prompts in this repo.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e .
      - name: Record mode run
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: skilltrial llm examples/skills --mode record --split all
      - name: Upload recordings
        uses: actions/upload-artifact@v4
        with:
          name: llm-recordings
          path: fixtures/llm/
