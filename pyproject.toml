[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skilltrial"
version = "0.1.0rc1"
description = "pytest for Agent Skills: lint SKILL.md files, check token budgets, and measure trigger precision and recall offline."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Shreyas" }]
requires-python = ">=3.11"
dependencies = ["PyYAML>=6"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Development Status :: 3 - Alpha",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
skilltrial = "skilltrial.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
